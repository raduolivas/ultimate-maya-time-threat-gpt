name: Game checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --save-dev --save-exact vite@latest vitest@latest @playwright/test@latest
      - name: Capture initial lockfile
        run: |
          echo MAYA_PACKAGE_BEGIN
          cat package.json
          echo MAYA_PACKAGE_END
          echo MAYA_LOCK_BEGIN
          cat package-lock.json
          echo MAYA_LOCK_END
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-build-and-test-results
          path: |
            dist/
            test-results/
          if-no-files-found: ignore
